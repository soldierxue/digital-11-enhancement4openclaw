<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<title>🔮 Claw Manager v2</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0d1117;
  color: #f0f6fc;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ─── 顶部状态栏 ─────────────────────────────── */
.topbar {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 0 20px;
  height: 40px;
  display: flex;
  align-items: center;
  gap: 0;
  font-size: 12px;
  color: #8b949e;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar .brand {
  color: #f0f6fc;
  font-weight: 600;
  font-size: 13px;
  margin-right: 16px;
}
.topbar .sep {
  color: #30363d;
  margin: 0 12px;
}
.topbar .sys-stat { color: #8b949e; }
.topbar .sys-stat b { color: #e6edf3; }
.topbar .today-stats { display: flex; gap: 12px; }
.topbar .today-stats .running-n { color: #58a6ff; }
.topbar .today-stats .done-n    { color: #3fb950; }
.topbar .today-stats .failed-n  { color: #f85149; }
.topbar .timestamp { margin-left: auto; color: #6e7681; }
.topbar .refresh-btn {
  background: none;
  border: 1px solid #30363d;
  color: #8b949e;
  padding: 2px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  margin-left: 10px;
  transition: all 0.15s;
}
.topbar .refresh-btn:hover { border-color: #58a6ff; color: #58a6ff; }

/* ─── 主体三栏布局 ────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 220px 1fr 260px;
  gap: 0;
  height: calc(100vh - 40px);
  overflow: hidden;
}

/* ─── 左栏：Org Chart ─────────────────────────── */
.sidebar-left {
  background: #0d1117;
  border-right: 1px solid #21262d;
  padding: 20px 0;
  overflow-y: auto;
}
.sidebar-left .section-title {
  font-size: 10px;
  font-weight: 600;
  color: #6e7681;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0 16px;
  margin-bottom: 12px;
}
.teammate {
  padding: 10px 16px;
  border-radius: 0;
  cursor: default;
  transition: background 0.15s;
  border-left: 2px solid transparent;
}
.teammate:hover { background: #161b22; }
.teammate.active { border-left-color: #3fb950; background: rgba(63,185,80,0.04); }
.teammate.resident { border-left-color: #58a6ff; background: rgba(88,166,255,0.04); }
.teammate-header { display: flex; align-items: center; gap: 6px; }
.teammate-emoji { font-size: 15px; }
.teammate-name { font-weight: 600; color: #e6edf3; font-size: 12px; }
.teammate-skill { font-size: 11px; color: #6e7681; margin-top: 2px; padding-left: 21px; }
.teammate-status { display: flex; align-items: center; gap: 5px; margin-top: 4px; padding-left: 21px; }
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.status-dot.active {
  background: #3fb950;
  box-shadow: 0 0 6px #3fb950;
}
.status-dot.resident {
  background: #58a6ff;
  box-shadow: 0 0 6px rgba(88,166,255,0.6);
}
.status-dot.idle { background: #484f58; }
.status-label { font-size: 11px; }
.status-label.active { color: #3fb950; }
.status-label.resident { color: #58a6ff; }
.status-label.idle { color: #6e7681; }
.teammate-cost { font-size: 10px; color: #d29922; margin-left: auto; }

/* ─── 中栏：任务看板 ──────────────────────────── */
.main-panel {
  background: #0d1117;
  overflow-y: auto;
  padding: 20px 24px;
}
.date-group { margin-bottom: 28px; }
.date-group-title {
  font-size: 11px;
  font-weight: 600;
  color: #6e7681;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #21262d;
}

/* 任务卡片 */
.task-card {
  background: #161b22;
  border: 1px solid #21262d;
  border-left: 3px solid #30363d;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 10px;
  transition: border-color 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}
.task-card.running {
  border-left-color: #58a6ff;
  box-shadow: 0 0 8px rgba(88,166,255,0.3);
}
.task-card.running::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: #58a6ff;
  animation: pulse-bar 2s ease-in-out infinite;
}
.task-card.done   { border-left-color: #3fb950; }
.task-card.failed { border-left-color: #f85149; }
.task-card.queued, .task-card.paused { border-left-color: #d29922; }

@keyframes pulse-bar {
  0%, 100% { opacity: 1; box-shadow: none; }
  50%       { opacity: 0.5; box-shadow: 0 0 12px rgba(88,166,255,0.8); }
}

.task-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
.status-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  letter-spacing: 0.05em;
  white-space: nowrap;
  flex-shrink: 0;
}
.status-badge.running { background:#1f3a5f; color:#58a6ff; border:1px solid #58a6ff; }
.status-badge.done    { background:#1a3a2a; color:#3fb950; border:1px solid #3fb950; }
.status-badge.failed  { background:#3a1a1a; color:#f85149; border:1px solid #f85149; }
.status-badge.queued, .status-badge.paused { background:#3a2a1a; color:#d29922; border:1px solid #d29922; }

.task-meta-line { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.task-assignee { font-size: 12px; color: #8b949e; white-space: nowrap; }
.task-label { font-weight: 600; color: #e6edf3; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-goal { font-size: 11px; color: #6e7681; margin-bottom: 6px; line-height: 1.4; }
/* Assignee badge: top-right pill */
.task-assignee-badge {
  margin-left: auto;
  font-size: 10px;
  color: #8b949e;
  background: #21262d;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 1px 7px;
  white-space: nowrap;
  flex-shrink: 0;
}
/* Dependencies line */
.task-deps { font-size: 10px; color: #484f58; margin-bottom: 6px; }

/* 进度条 */
.batch-progress { margin-bottom: 8px; }
.progress-track {
  display: inline-flex; gap: 3px; align-items: center; margin-right: 8px;
}
.progress-block {
  width: 10px; height: 10px;
  border-radius: 2px;
  background: #30363d;
  display: inline-block;
}
.progress-block.filled { background: #58a6ff; }
.progress-text { font-size: 11px; color: #8b949e; }

/* 任务底部元信息 */
.task-footer {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 8px;
  font-size: 11px;
  color: #6e7681;
  border-top: 1px solid #21262d;
  padding-top: 8px;
}
.task-footer .elapsed { color: #8b949e; }
.task-footer .cost { color: #6e7681; margin-left: auto; }
.restart-badge { font-size: 10px; color: #d29922; }
.task-btns { display: flex; gap: 6px; margin-top: 6px; }
.btn {
  background: #21262d;
  border: 1px solid #30363d;
  color: #8b949e;
  padding: 3px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  transition: all 0.15s;
}
.btn:hover { background: #30363d; color: #f0f6fc; border-color: #58a6ff; }
.btn.danger:hover { border-color: #f85149; color: #f85149; }

/* ─── 右栏：告警 + 事件流 ─────────────────────── */
.sidebar-right {
  background: #0d1117;
  border-left: 1px solid #21262d;
  overflow-y: auto;
  padding: 20px 0;
}
.sidebar-right .section {
  padding: 0 16px;
  margin-bottom: 24px;
}
.section-title {
  font-size: 10px;
  font-weight: 600;
  color: #6e7681;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title .count-badge {
  background: #f85149;
  color: #fff;
  font-size: 9px;
  padding: 0 5px;
  border-radius: 8px;
  font-weight: 700;
}

/* 告警卡片 */
.alert-card {
  background: rgba(248,81,73,0.08);
  border: 1px solid rgba(248,81,73,0.2);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 6px;
  font-size: 11px;
  color: #e6edf3;
  line-height: 1.5;
}
.alert-card .alert-time { color: #6e7681; font-size: 10px; display: block; margin-top: 3px; }
.alert-card .alert-msg { color: #f0f6fc; }

/* 事件流 */
.event-stream { }
.event-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid #0d1117;
  font-size: 11px;
  position: relative;
  padding-left: 14px;
}
.event-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 10px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #484f58;
}
.event-item.phase_done::before { background: #3fb950; box-shadow: 0 0 4px #3fb950; }
.event-item.crash::before      { background: #f85149; box-shadow: 0 0 4px #f85149; }
.event-item.registered::before { background: #58a6ff; box-shadow: 0 0 4px #58a6ff; }
.event-item.warn::before       { background: #d29922; }
.event-time { color: #6e7681; white-space: nowrap; flex-shrink: 0; }
.event-name { color: #8b949e; }
.event-task { color: #6e7681; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ─── 空状态 ──────────────────────────────────── */
.empty-state {
  text-align: center;
  color: #484f58;
  padding: 40px 20px;
  font-size: 13px;
}
.empty-state .icon { font-size: 32px; margin-bottom: 8px; }

/* ─── 滚动条美化 ──────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }

/* ─── 队员选中态 ─────────────────────────────── */
.teammate.selected {
  border-left-color: #58a6ff !important;
  background: rgba(88,166,255,0.08) !important;
}

/* ─── Skill 档案页 ───────────────────────────── */
.skill-profile {
  padding: 8px 4px;
}
.sp-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 12px;
}
.sp-back-btn {
  background: none;
  border: 1px solid #30363d;
  color: #58a6ff;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
  white-space: nowrap;
}
.sp-back-btn:hover { background: rgba(88,166,255,0.1); border-color: #58a6ff; }
.sp-title { display: flex; align-items: center; gap: 8px; }
.sp-emoji { font-size: 22px; }
.sp-cn { font-size: 16px; font-weight: 700; color: #e6edf3; }
.sp-en { font-size: 13px; color: #8b949e; }
.sp-divider { border: none; border-top: 1px solid #30363d; margin-bottom: 18px; }
.sp-section { margin-bottom: 20px; }
.sp-section-title {
  font-size: 12px;
  font-weight: 600;
  color: #e6edf3;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid #21262d;
}
.sp-desc {
  font-size: 12px;
  color: #8b949e;
  line-height: 1.6;
}
.sp-phases { display: flex; flex-direction: column; gap: 2px; }
.sp-phase-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 12px;
}
.sp-phase-num {
  color: #6e7681;
  white-space: nowrap;
  min-width: 56px;
  font-size: 11px;
}
.sp-phase-name {
  color: #c9d1d9;
  flex: 1;
}
.sp-phase-indicator { margin-left: auto; font-size: 11px; }
.sp-stats-box {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 14px 16px;
}
.sp-stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.sp-stat { text-align: center; }
.sp-stat-val {
  font-size: 18px;
  font-weight: 700;
  color: #58a6ff;
  line-height: 1.2;
}
.sp-stat-lbl {
  font-size: 10px;
  color: #6e7681;
  margin-top: 3px;
}
.sp-achievements { display: flex; flex-direction: column; gap: 6px; }
.sp-achievement {
  font-size: 12px;
  color: #c9d1d9;
  padding: 5px 8px;
  background: rgba(63,185,80,0.05);
  border-radius: 4px;
  border-left: 2px solid #3fb950;
}
</style>
</head>
<body>

<!-- 顶部状态栏 -->
<div class="topbar">
  <span class="brand">🔮 Claw Manager v2</span>
  <span class="sep">|</span>
  <span class="sys-stat">CPU <b>{{CPU_PCT}}%</b> &nbsp;MEM <b>{{MEM_PCT}}%</b> &nbsp;DISK <b>{{DISK_PCT}}%</b></span>
  <span class="sep">|</span>
  <span class="today-stats">
    今日: <span class="running-n">{{RUNNING_N}}运行</span> <span class="done-n">{{DONE_N}}完成</span> <span class="failed-n">{{FAILED_N}}失败</span>
  </span>
  <span class="timestamp">{{NOW_STR}}</span>
  <button class="refresh-btn" onclick="location.reload()">↺ 刷新</button>
</div>

<!-- 三栏主体 -->
<div class="layout">

  <!-- 左栏：队友 Org Chart -->
  <div class="sidebar-left">
    <div class="section-title">11小分队</div>
    {{TEAMMATES_HTML}}
  </div>

  <!-- 中栏：任务看板 + Skill 档案页 -->
  <div class="main-panel">
    <div id="main-panel">
      {{TASKS_BY_DATE_HTML}}
    </div>
    <div id="skill-profile" style="display:none">
      {{SKILL_PROFILES_HTML}}
    </div>
  </div>

  <!-- 右栏：告警 + 事件流 -->
  <div class="sidebar-right">
    <div class="section">
      <div class="section-title">🚨 告警 {{ALERTS_COUNT_BADGE}}</div>
      {{ALERTS_HTML}}
    </div>
    <div class="section">
      <div class="section-title">📋 事件流</div>
      <div class="event-stream">
        {{EVENTS_HTML}}
      </div>
    </div>
  </div>

</div>

<script>
async function trigger(action, taskId) {
  try {
    const r = await fetch('http://localhost:17890/trigger', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action, taskId})
    });
    if (r.ok) setTimeout(() => location.reload(), 500);
    else alert('操作失败');
  } catch(e) {
    alert('守护进程未响应: ' + e);
  }
}

function showSkillProfile(teammateId) {
  // Hide all profiles first
  document.querySelectorAll('.skill-profile').forEach(p => p.style.display = 'none');
  // Show the selected one
  const target = document.getElementById('profile-' + teammateId);
  if (target) target.style.display = 'block';
  // Switch panels
  document.getElementById('main-panel').style.display = 'none';
  document.getElementById('skill-profile').style.display = 'block';
  // Highlight selected teammate card
  document.querySelectorAll('.teammate').forEach(c => {
    c.classList.remove('selected');
    c.style.borderLeftColor = '';
  });
  const card = document.getElementById('teammate-' + teammateId);
  if (card) {
    card.classList.add('selected');
    card.style.borderLeftColor = '#58a6ff';
  }
}

function showMainPanel() {
  document.getElementById('main-panel').style.display = 'block';
  document.getElementById('skill-profile').style.display = 'none';
  document.querySelectorAll('.teammate').forEach(c => {
    c.classList.remove('selected');
    c.style.borderLeftColor = '';
  });
}
</script>
</body>
</html>
